services:
  - type: web
    name: channeled
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: channeled-db
          property: connectionString

databases:
  - name: channeled-db
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: channeled
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: channeled-db
          property: connectionString
      # Auth (Google OAuth). Fill these in via the Render dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Same-origin in prod, so BASE_URL is the public site URL.
      - key: BASE_URL
        value: https://channeled.onrender.com
      # Optional: claim pre-auth workspaces for this email on first login.
      - key: BACKFILL_USER_EMAIL
        sync: false

databases:
  - name: channeled-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
